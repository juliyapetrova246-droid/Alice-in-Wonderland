<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alice in Wonderland · Interactive English Lab</title>
  <style>
    :root {
      --bg-parchment: #f7f3e8;
      --bg-parchment-dark: #ede5d2;
      --card-bg: #fffdf9;
      --royal-emerald: #1b4332;
      --royal-emerald-hover: #122e22;
      --burgundy: #7f1d1d;
      --gold: #b45309;
      --gold-light: #fef3c7;
      --gold-border: #d97706;
      --ink-main: #1f2937;
      --ink-muted: #57534e;
      --border-classic: #d6cbb5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-parchment);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(217, 119, 6, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(27, 67, 50, 0.07) 0%, transparent 45%),
        repeating-linear-gradient(0deg, rgba(180, 160, 130, 0.04) 0px, rgba(180, 160, 130, 0.04) 1px, transparent 1px, transparent 4px);
      color: var(--ink-main);
      line-height: 1.6;
      min-height: 100vh;
      padding: 28px 16px 60px;
      position: relative;
      overflow-x: hidden;
    }

    .floating-suits {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .suit-item {
      position: absolute;
      font-size: 1.8rem;
      opacity: 0.08;
      animation: floatSlow 18s infinite ease-in-out;
      user-select: none;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-22px) rotate(12deg); }
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 42px 32px;
      text-align: center;
      box-shadow: 0 14px 35px rgba(45, 35, 20, 0.08);
      border: 2px solid var(--border-classic);
      position: relative;
      margin-bottom: 32px;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px dashed rgba(180, 83, 9, 0.35);
      border-radius: 15px;
      pointer-events: none;
    }

    .ornament {
      font-size: 1.35rem;
      letter-spacing: 0.55rem;
      color: var(--royal-emerald);
      margin-bottom: 14px;
    }

    .ornament .red {
      color: var(--burgundy);
    }

    .hero h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.45rem;
      font-weight: 700;
      color: var(--royal-emerald);
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .hero .subtitle {
      font-size: 1.08rem;
      color: var(--ink-muted);
      max-width: 700px;
      margin: 0 auto 24px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 26px;
    }

    .tag {
      background: var(--bg-parchment);
      border: 1px solid var(--border-classic);
      padding: 6px 15px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      color: #3f3a34;
    }

    .quote-box {
      background: linear-gradient(to right, #fdfbf7, #f8f2e4, #fdfbf7);
      border-top: 1px solid var(--border-classic);
      border-bottom: 1px solid var(--border-classic);
      padding: 16px 20px;
      max-width: 680px;
      margin: 0 auto;
      border-radius: 12px;
    }

    .quote-en {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 1.08rem;
      color: var(--burgundy);
      margin-bottom: 4px;
    }

    .quote-ru {
      font-size: 0.9rem;
      color: var(--ink-muted);
      margin-bottom: 10px;
    }

    .quote-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mini-btn {
      background: #ffffff;
      border: 1px solid var(--border-classic);
      color: var(--ink-main);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mini-btn:hover {
      border-color: var(--gold-border);
      background: var(--gold-light);
    }

    .controls-bar {
      background: var(--card-bg);
      border: 1px solid var(--border-classic);
      border-radius: 16px;
      padding: 18px 24px;
      margin-bottom: 26px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 14px rgba(45, 35, 20, 0.04);
    }

    .progress-wrap {
      flex: 1;
      min-width: 240px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--royal-emerald);
      margin-bottom: 6px;
    }

    .progress-track {
      height: 10px;
      background: var(--bg-parchment-dark);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--royal-emerald), var(--gold-border));
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--bg-parchment);
      border: 1px solid var(--border-classic);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--royal-emerald);
      color: #ffffff;
      border-color: var(--royal-emerald);
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(305px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 24px;
      border: 1px solid var(--border-classic);
      box-shadow: 0 6px 18px rgba(45, 35, 20, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      position: relative;
    }

    .card.active:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 28px rgba(180, 83, 9, 0.14);
      border-color: var(--gold-border);
    }

    .card.locked {
      background: #f4efe4;
      opacity: 0.82;
    }

    .card.completed {
      border-color: var(--royal-emerald);
      background: linear-gradient(to bottom, #f4fbf7, #fffdf9);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .chapter-tag {
      font-family: Georgia, serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--burgundy);
      letter-spacing: 0.04em;
    }

    .badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 999px;
    }

    .badge.open {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .badge.soon {
      background: #e7e2d5;
      color: #6b645c;
    }

    .card-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .card h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.28rem;
      font-weight: 700;
      color: #1c1917;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 0.94rem;
      color: var(--ink-muted);
      margin-bottom: 16px;
    }

    .grammar-pill {
      display: inline-block;
      font-size: 0.8rem;
      background: var(--gold-light);
      color: #92400e;
      border: 1px solid #fde68a;
      padding: 4px 11px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px 16px;
      border-radius: 11px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .btn-primary {
      background: var(--royal-emerald);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(27, 67, 50, 0.2);
    }

    .btn-primary:hover {
      background: var(--royal-emerald-hover);
    }

    .btn-disabled {
      background: #e5dec9;
      color: #8c8273;
      cursor: not-allowed;
      pointer-events: none;
    }

    .done-toggle {
      background: transparent;
      border: 1px dashed var(--border-classic);
      color: var(--ink-muted);
      padding: 7px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .done-toggle:hover {
      border-color: var(--royal-emerald);
      color: var(--royal-emerald);
    }

    .card.completed .done-toggle {
      background: #dcfce7;
      border-style: solid;
      border-color: #86efac;
      color: #166534;
    }

    footer {
      text-align: center;
      margin-top: 52px;
      padding-top: 20px;
      border-top: 1px solid var(--border-classic);
      font-size: 0.9rem;
      color: var(--ink-muted);
    }

    @media (max-width: 640px) {
      .hero h1 { font-size: 1.8rem; }
      .hero { padding: 30px 18px; }
    }
  </style>
</head>
<body>
  <div class="floating-suits" aria-hidden="true">
    <div class="suit-item" style="top: 8%; left: 6%; animation-delay: 0s;">♠</div>
    <div class="suit-item" style="top: 18%; right: 8%; color: #7f1d1d; animation-delay: 3s;">♥</div>
