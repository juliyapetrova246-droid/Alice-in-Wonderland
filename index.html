<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alice’s Adventures in Wonderland · Interactive Storybook</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Great+Vibes&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-room: radial-gradient(circle at 50% 35%, #2b1d38 0%, #120b1c 65%, #07040c 100%);
      --cover-leather: linear-gradient(135deg, #163a2c 0%, #0d261c 50%, #1b112c 100%);
      --gold-foil: #e6c27a;
      --gold-bright: #ffd97d;
      --gold-dark: #9e7328;
      --page-paper: #fbf6ea;
      --page-shadow: #e6dcc6;
      --ink-dark: #1f1a17;
      --ink-muted: #574d42;
      --crimson: #8b1e24;
      --emerald: #164232;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--bg-room);
      color: var(--ink-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px 40px;
      overflow-x: hidden;
      position: relative;
    }

    /* Cinematic Floating Magic Dust & Cards */
    .wonderland-sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-relic {
      position: absolute;
      color: var(--gold-bright);
      opacity: 0.25;
      filter: drop-shadow(0 0 8px rgba(255, 217, 125, 0.6));
      animation: levitate 12s infinite ease-in-out;
      user-select: none;
    }

    @keyframes levitate {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.18; }
      50% { transform: translateY(-35px) rotate(16deg) scale(1.18); opacity: 0.42; }
    }

    /* Top Header Ribbon */
    .cinema-header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      z-index: 2;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-mark {
      font-family: 'Cinzel Decorative', serif;
      color: var(--gold-foil);
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .nav-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .top-pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(230, 194, 122, 0.4);
      color: var(--gold-bright);
      padding: 6px 14px;
      border-radius: 999px;
      font-family: 'Lora', serif;
      font-size: 0.84rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.25s ease;
    }

    .top-pill-btn:hover {
      background: rgba(230, 194, 122, 0.22);
      transform: translateY(-1px);
    }

    /* 3D Book Stage */
    .book-stage {
      width: 100%;
      max-width: 960px;
      perspective: 2200px;
      z-index: 2;
      position: relative;
    }

    /* CLOSED BOOK COVER */
    .book-cover-view {
      width: 100%;
      max-width: 560px;
      min-height: 650px;
      margin: 0 auto;
      background: var(--cover-leather);
      border-radius: 12px 26px 26px 12px;
      box-shadow: 
        -14px 0 0 #0a1712,
        -18px 8px 25px rgba(0,0,0,0.8),
        0 25px 60px rgba(0,0,0,0.75),
        inset 0 0 60px rgba(0,0,0,0.65);
      border: 3px solid var(--gold-dark);
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.6s ease;
    }

    .book-cover-view:hover {
      transform: translateY(-6px) rotateY(-4deg);
      box-shadow: 
        -14px 0 0 #0a1712,
        0 30px 70px rgba(230, 194, 122, 0.25),
        inset 0 0 60px rgba(0,0,0,0.65);
    }

    /* Spine groove */
    .book-cover-view::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 22px;
      width: 4px;
      background: linear-gradient(to right, rgba(0,0,0,0.6), rgba(255,217,125,0.25), rgba(0,0,0,0.6));
    }

    /* Gold filigree inner frame */
    .gold-frame {
      width: 100%;
      height: 100%;
      border: 2px solid var(--gold-foil);
      border-radius: 8px 18px 18px 8px;
      padding: 28px 22px;
      margin-left: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      box-shadow: inset 0 0 20px rgba(230, 194, 122, 0.15);
    }

    .flourish-top {
      font-family: 'Great Vibes', cursive;
      font-size: 2rem;
      color: var(--gold-bright);
      letter-spacing: 0.08em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }

    .cover-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.35rem;
      font-weight: 900;
      line-height: 1.22;
      background: linear-gradient(180deg, #fff3c4 0%, #e6c27a 55%, #b5852a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8));
      margin: 10px 0;
    }

    .cover-script {
      font-family: 'Great Vibes', cursive;
      font-size: 2.1rem;
      color: var(--gold-foil);
      margin-bottom: 12px;
    }

    .cover-emblem {
      width: 170px;
      height: 170px;
      margin: 8px auto;
      filter: drop-shadow(0 0 16px rgba(255, 217, 125, 0.35));
      animation: pulseGlow 4s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(255, 217, 125, 0.3)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 24px rgba(255, 217, 125, 0.65)); }
    }

    .open-book-btn {
      background: linear-gradient(135deg, #e6c27a 0%, #b5852a 100%);
      color: #140d07;
      border: 2px solid #fff3c4;
      padding: 14px 32px;
      border-radius: 999px;
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      transition: all 0.3s ease;
    }

    .open-book-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 28px rgba(255, 217, 125, 0.7);
    }

    /* OPEN BOOK SPREAD */
    .open-book-spread {
      display: none;
      width: 100%;
      background: var(--page-paper);
      background-image: 
        linear-gradient(to right, rgba(0,0,0,0.06) 0%, transparent 4%, transparent 48%, rgba(0,0,0,0.16) 50%, transparent 52%, transparent 96%, rgba(0,0,0,0.06) 100%),
        radial-gradient(circle at center, #fffdf8 0%, #f3ead6 100%);
      border-radius: 18px;
      border: 8px solid #163a2c;
      outline: 2px solid var(--gold-foil);
      box-shadow: 0 28px 70px rgba(0,0,0,0.85);
      min-height: 620px;
      grid-template-columns: 1fr 1fr;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .open-book-spread.visible {
      display: grid;
      animation: bookAppear 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes bookAppear {
      from { opacity: 0; transform: scale(0.92) rotateX(8deg); }
      to { opacity: 1; transform: scale(1) rotateX(0deg); }
    }

    /* Page flip transition animation */
    .page-flipping {
      animation: flipPageEffect 0.55s ease-in-out;
    }

    @keyframes flipPageEffect {
      0% { opacity: 1; transform: rotateY(0deg); }
      45% { opacity: 0.25; transform: rotateY(-14deg) scale(0.98); }
      100% { opacity: 1; transform: rotateY(0deg) scale(1); }
    }

    .page-left, .page-right {
      padding: 36px 34px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .page-left {
      border-right: 1px solid rgba(139, 115, 85, 0.25);
      align-items: center;
      text-align: center;
    }

    .page-ornament {
      font-family: 'Great Vibes', cursive;
      font-size: 1.7rem;
      color: var(--gold-dark);
    }

    .illustration-frame {
      width: 100%;
      max-width: 310px;
      height: 290px;
      background: #fffdf9;
      border: 2px solid #cbb994;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(180, 140, 80, 0.14), 0 8px 20px rgba(0,0,0,0.06);
      position: relative;
    }

    .illustration-frame::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px dashed #b5852a;
      border-radius: 9px;
      pointer-events: none;
    }

    .illustration-frame svg {
      width: 100%;
      height: 100%;
    }

    .quote-caption {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--crimson);
      max-width: 320px;
    }

    .page-number {
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.85rem;
      color: var(--ink-muted);
      letter-spacing: 0.1em;
    }

    /* Right Page Content */
    .chapter-kicker {
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--crimson);
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .chapter-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--emerald);
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .drop-cap::first-letter {
      font-family: 'Cinzel Decorative', serif;
